# Render deployment blueprint.
# In Render: New -> Blueprint -> pick this repo. It builds the Dockerfile and
# serves the app (and the demo UI at /). Only LLM_API_KEY needs to be filled in.
services:
  - type: web
    name: ai-pr-reviewer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      # Secret — paste your Groq key in the Render dashboard when prompted.
      - key: LLM_API_KEY
        sync: false
      # The demo UI never calls GitHub, so these can stay as placeholders.
      # Fill them in later only if you enable the PR webhook.
      - key: GITHUB_TOKEN
        value: unused-for-demo
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
